<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 14" width="1000" height="14" role="presentation"><defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter><linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#8b5cf6" stop-opacity=".9"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></linearGradient></defs>
<rect x="0" y="6" width="1000" height="2" fill="url(#l)"/><circle cy="7" r="4" fill="#fff" filter="url(#glow)"><animate attributeName="cx" values="0;1000" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="4s" repeatCount="indefinite"/></circle></svg>